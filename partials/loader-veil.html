<!--
  Loader veil - الضربة الضوئية (variant A, the approved loader)

  SOURCE : loader.html, the LOADER VEIL block (extracted verbatim)
  STATUS : REFERENCE ONLY. At runtime js/app.js injects this same markup;
           css/transition.css carries the keyframes it needs.
  PURPOSE: the page-transition overlay, shown while moving between pages.
-->

<div class="sh-anim" style="position:absolute;inset:0;background:#0a1a33;display:flex;align-items:center;justify-content:center;animation:none">
      <span style="position:absolute;top:0;bottom:0;right:22%;width:1px;background:rgba(126,168,221,.1)"></span>
      <span style="position:absolute;top:0;bottom:0;left:22%;width:1px;background:rgba(126,168,221,.1)"></span>
      <span style="position:absolute;top:-170px;left:-130px;width:480px;height:480px;border:1px solid rgba(126,168,221,.1);border-radius:50%;pointer-events:none"></span>

      <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;animation:none">
        <!-- 01 seed diamond (center) → hands over to the nib -->
        <span class="sh-hide-static" style="position:absolute;top:calc(50% - 40px);width:12px;height:12px;background:#1b5aa6;opacity:0;animation:sh-seed .42s cubic-bezier(.2,.7,.2,1) forwards, sh-fade .28s .5s reverse forwards"></span>

        <!-- 02–03 the mark draws itself along its own calligraphic stroke -->
        <span style="position:relative;width:300px;aspect-ratio:583/377">
          <svg viewBox="0 0 583 377" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
            <defs>
              <mask id="mFinal" maskUnits="userSpaceOnUse" x="-60" y="-60" width="703" height="497">
                <path class="sh-static" pathLength="1000" d="M 505 28 C 530 60, 470 88, 452 118 C 432 150, 470 170, 440 205 C 405 245, 360 225, 335 195 C 305 160, 300 110, 275 100 C 268 170, 282 250, 300 320 C 330 342, 360 300, 330 268 C 280 215, 190 280, 120 300 C 55 315, 20 270, 22 200 C 25 120, 90 55, 170 42 C 205 38, 235 45, 262 60" fill="none" stroke="#fff" stroke-width="118" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="1000" style="animation:sh-draw 1.35s cubic-bezier(.45,0,.2,1) .4s forwards"></path>
                <rect class="sh-static" x="-60" y="-60" width="703" height="497" fill="#fff" opacity="0" style="animation:sh-fade .35s ease 1.55s forwards"></rect>
              </mask>
            </defs>
            <image href="assets/images/logo-white.png" width="583" height="377" mask="url(#mFinal)"></image>
          </svg>
          <span class="sh-hide-static" style="position:absolute;top:0;left:0;width:15px;height:15px;background:#1b5aa6;transform:rotate(45deg);offset-path:path('M 259.9 14.4 C 272.7 30.9, 241.9 45.3, 232.6 60.7 C 222.3 77.2, 241.9 87.5, 226.4 105.5 C 208.4 126.1, 185.2 115.8, 172.4 100.3 C 156.9 82.3, 154.4 56.6, 141.5 51.5 C 137.9 87.5, 145.1 128.6, 154.4 164.7 C 169.8 176.0, 185.2 154.4, 169.8 137.9 C 144.1 110.6, 97.8 144.1, 61.7 154.4 C 28.3 162.1, 10.3 138.9, 11.3 102.9 C 12.9 61.7, 46.3 28.3, 87.5 21.6 C 105.5 19.6, 120.9 23.2, 134.8 30.9');offset-rotate:0deg;opacity:0;animation:sh-nib-travel 1.35s cubic-bezier(.45,0,.2,1) .4s forwards"></span>
          <!-- 06 one light sweep once the mark is complete -->
          <span class="sh-hide-static" style="position:absolute;top:-10%;bottom:-10%;left:0;width:14%;background:#fff;opacity:0;mix-blend-mode:overlay;animation:sh-sweep .9s cubic-bezier(.45,0,.2,1) 1.9s forwards"></span>
        </span>

        <!-- 04–05 wordline rises, softer tagline fades -->
        <span style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <span class="sh-static" style="display:flex;align-items:center;gap:10px;font-family:'Almarai',sans-serif;font-size:12px;font-weight:800;letter-spacing:.22em;color:#fff;opacity:0;animation:sh-rise .55s cubic-bezier(.2,.7,.2,1) 1.75s forwards"><span style="width:16px;height:1px;background:#1b5aa6"></span>وكالة شهاب للأنباء<span style="width:16px;height:1px;background:#1b5aa6"></span></span>
          <span class="sh-static" style="font-family:'Noto Naskh Arabic',serif;font-size:12.5px;color:#7ea8dd;opacity:0;animation:sh-fade .8s ease 2.15s forwards">نرصد اللحظة ونحفظ أثرها</span>
        </span>

        <!-- 07 loading indicator: three diamonds — the only element that loops -->
        <span class="sh-hide-static" style="display:flex;align-items:center;gap:9px;margin-top:6px;opacity:0;animation:sh-fade .5s ease 2.5s forwards">
          <span style="width:7px;height:7px;background:#1b5aa6;animation:sh-dots 1.1s ease-in-out infinite"></span>
          <span style="width:7px;height:7px;background:#1b5aa6;animation:sh-dots 1.1s ease-in-out infinite .18s"></span>
          <span style="width:7px;height:7px;background:#1b5aa6;animation:sh-dots 1.1s ease-in-out infinite .36s"></span>
        </span>
      </div>
      <!-- exit: the diamond leaves first -->
      <span style="position:absolute;bottom:18%;width:10px;height:10px;background:#1b5aa6;transform:rotate(45deg);opacity:0;animation:none"></span>
    </div>
